services:
  db:
    image: postgres:16-alpine
    container_name: alphabee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alphabee
      POSTGRES_PASSWORD: alphabee
      POSTGRES_DB: alphabee
    ports:
      - '5432:5432'
    volumes:
      - alphabee_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alphabee -d alphabee']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alphabee_pg_data:
